<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10243a"><title>CarDamage Manager – Prototyp</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#14243a;background:#f2f5f9}*{box-sizing:border-box}body{margin:0}header{background:#10243a;color:white;padding:19px max(16px,calc((100vw - 960px)/2));display:flex;align-items:center;justify-content:space-between}header strong{font-size:20px}header small{display:block;color:#b9cde2;margin-top:3px}.wrap{max-width:960px;margin:auto;padding:18px 14px 90px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.nav button{background:white;color:#20344c;border:1px solid #dce4ee}.nav button.active{background:#1767b3;color:white;border-color:#1767b3}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 15px;background:#1767b3;color:white;font-weight:600}button.secondary{background:#e8eef6;color:#20344c}button.danger{background:#a92f3c}button:disabled{opacity:.5;cursor:not-allowed}.panel{background:white;border:1px solid #dfe6ef;border-radius:16px;padding:20px;margin:0 0 15px;box-shadow:0 3px 12px #1c35500b}h1{font-size:25px;margin:0 0 6px}h2{font-size:18px;margin:0 0 16px}h3{margin:0 0 7px;font-size:16px}p{line-height:1.45}.muted{color:#607189}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat{background:#f0f5fb;padding:14px;border-radius:12px}.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:#50657e}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}label{display:block;font-size:13px;font-weight:650;margin:0 0 6px;color:#344963}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd7e5;border-radius:9px;font:inherit;background:white;color:#14243a}textarea{min-height:85px;resize:vertical}.field{margin:0 0 15px}.actions{display:flex;gap:8px;flex-wrap:wrap}.list{display:grid;gap:10px}.item{border:1px solid #dfe6ef;border-radius:12px;padding:14px;background:#fff}.item-head{display:flex;justify-content:space-between;align-items:start;gap:10px}.pill{display:inline-block;font-size:12px;border-radius:20px;padding:5px 9px;background:#e9f2ff;color:#145aa0;font-weight:650}.pill.warn{background:#fff0db;color:#8d5100}.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,90px));gap:9px;margin:12px 0}.photo-grid a{display:block;width:90px;max-width:100%;height:80px}.photo-grid a img{width:100%;height:100%;object-fit:cover;border-radius:8px;border:1px solid #dbe3ed}.cmr-box{background:#f2f7ff;border:1px solid #b9d4f5;border-radius:10px;padding:12px;margin:12px 0}.cmr-box a{word-break:break-word}.photo{position:relative}.photo img{width:100%;height:115px;object-fit:cover;border-radius:9px}.photo button{position:absolute;top:5px;right:5px;padding:4px 8px;background:#9e2834}.hint{font-size:12px;color:#64758a}.empty{text-align:center;padding:35px 12px;color:#667b91}.notice{background:#fff6e6;border:1px solid #f4d9a3;padding:12px;border-radius:10px;font-size:13px;color:#715018;margin-bottom:15px}.back{margin-bottom:12px}.hidden{display:none!important}@media(max-width:570px){.grid{grid-template-columns:1fr}.panel{padding:15px}.stats{gap:6px}.stat{padding:10px}.stat b{font-size:21px}.nav button{flex:1;padding:10px 7px;font-size:13px}}
</style><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="CarDamage"></head><body><header><div><strong>CarDamage Manager</strong><small>Fahrzeug- und Schadenakte · Prototyp 0.7</small></div><span>🚘</span></header><main class="wrap"><div class="notice">Lokaler Testprototyp: Daten werden ausschließlich in diesem Browser gespeichert. Keine Cloud-Synchronisation, keine KI-/FIN-Fotoerkennung und keine rechtssichere Rechnungsstellung. Für echte Betriebsdaten noch nicht geeignet.</div><nav class="nav"><button data-page="dashboard" class="active">Übersicht</button><button data-page="vehicles">Fahrzeuge</button><button data-page="start">+ Schadenaufnahme</button><button data-page="newVehicle">+ Fahrzeug</button><button data-page="backup">Export / Import</button></nav><div id="app"></div></main><script>
const KEY='cardamage-demo-v1';let state=load(),page='dashboard',selected=null,editingDamage=null,initialVin='',captureAfterVehicle=false,emailDamageId=null;function load(){try{return JSON.parse(localStorage.getItem(KEY))||{vehicles:[],damages:[]}}catch(e){return {vehicles:[],damages:[]}}}function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('Speicher voll. Bitte Bilder reduzieren oder Daten exportieren.');return false}}function uid(){return (typeof crypto!=='undefined' && typeof crypto.randomUUID==='function')?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function date(s){return s?new Date(s).toLocaleDateString('de-DE'): '–'}function val(form,key){return form.elements[key]?.value.trim()||''}function damagesFor(id){return state.damages.filter(d=>d.vehicleId===id)}function setPage(p,id){page=p;selected=id??selected;render();window.scrollTo(0,0)}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let a=document.getElementById('app');if(page==='dashboard')a.innerHTML=dashboard();if(page==='start')a.innerHTML=startCapture();if(page==='vehicles')a.innerHTML=vehicles();if(page==='newVehicle')a.innerHTML=vehicleForm();if(page==='detail')a.innerHTML=detail();if(page==='damage')a.innerHTML=damageForm();if(page==='backup')a.innerHTML=backup();if(page==='email')a.innerHTML=emailForm();bind()}
function startCapture(){return `<h1>Schadenaufnahme starten</h1><p class="muted">Schritt 1 von 2: Zuerst die 17-stellige Fahrzeug-Identifizierungsnummer eingeben. Danach werden die Schadenfotos aufgenommen.</p><div class="panel"><form id="vinFirstForm" novalidate><div class="field"><label for="vinFirst">Fahrzeug-Identifizierungsnummer (FIN) *</label><input id="vinFirst" name="vin" required minlength="17" maxlength="17" pattern="[A-HJ-NPR-Z0-9a-hj-npr-z]{17}" style="text-transform:uppercase" autocapitalize="characters" spellcheck="false" placeholder="17-stellige FIN" autocomplete="off" value="${esc(initialVin)}"></div><p class="hint">Bereits vorhandene Fahrzeuge werden anhand der FIN geöffnet. Bei einer neuen FIN werden zuerst die Stammdaten ergänzt.</p><button type="submit">Weiter zur Schadenaufnahme →</button></form></div></div>`}function beginDamageFor(id){selected=id;editingDamage=null;pendingPhotos=[];setPage('damage',id)}
function cmrLink(cmr){if(!cmr)return '<span class="muted">Noch kein CMR hinterlegt</span>';return `<a href="${cmr.data}" target="_blank" rel="noopener" download="${esc(cmr.name||'CMR')}">${cmr.type?.startsWith('image/')?`<img src="${cmr.data}" alt="CMR-Vorschau" style="width:84px;height:90px;object-fit:cover;border-radius:8px;vertical-align:middle;margin-right:9px">`:'📄 '}${esc(cmr.name||'CMR anzeigen')}</a>`}function normalizeVinInput(input){input.value=input.value.toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g,'').slice(0,17)}function readFileData(file){return new Promise((resolve,reject)=>{if(!file)return reject(Error('Kein Dokument gewählt'));if(!file.type.startsWith('image/')&&file.type!=='application/pdf')return reject(Error('Bitte Bild oder PDF auswählen'));if(file.size>3*1024*1024)return reject(Error('CMR-Datei darf höchstens 3 MB groß sein'));let reader=new FileReader();reader.onload=()=>resolve({name:file.name,type:file.type,data:reader.result});reader.onerror=()=>reject(Error('Datei konnte nicht gelesen werden'));reader.readAsDataURL(file)})}function dashboard(){let open=state.damages.filter(d=>d.status!=='Abgeschlossen').length;return `<h1>Übersicht</h1><p class="muted">Alle Fahrzeuge und Schadenfälle auf einen Blick.</p><div class="stats"><div class="stat"><b>${state.vehicles.length}</b><span>Fahrzeuge</span></div><div class="stat"><b>${state.damages.length}</b><span>Schäden</span></div><div class="stat"><b>${open}</b><span>Offene Schäden</span></div></div><div class="panel"><h2>Letzte Fahrzeuge</h2>${state.vehicles.length?`<div class="list">${state.vehicles.slice().reverse().slice(0,8).map(vehicleItem).join('')}</div>`:'<div class="empty">Noch keine Fahrzeuge angelegt.</div>'}</div><button id="startCapture">+ Schadenaufnahme mit FIN starten</button>`}
function vehicleItem(v){let n=damagesFor(v.id).length;return `<div class="item"><div class="item-head"><div><b>${esc(v.make)} ${esc(v.model)}</b><div class="muted" style="font-size:13px;margin-top:5px">FIN: ${esc(v.vin)} · ${n} Schadenfälle</div></div><button class="secondary open" data-id="${v.id}">Öffnen</button></div></div>`}
function vehicles(){return `<h1>Fahrzeuge</h1><div class="panel"><div class="field"><label for="search">Fahrzeug suchen (FIN, Hersteller, Modell, Bestandsnummer)</label><input id="search" placeholder="Suchbegriff"></div><div id="vehicleList" class="list">${state.vehicles.length?state.vehicles.map(vehicleItem).join(''):'<div class="empty">Keine Fahrzeuge vorhanden.</div>'}</div></div>`}
function vehicleForm(){return `<h1>Fahrzeug erfassen</h1><p class="muted">${captureAfterVehicle?"Schritt 1 von 2: Fahrzeugstammdaten ergänzen. Anschließend öffnet sich automatisch die Schadenaufnahme.":"Fahrzeugstammdaten anlegen."}</p><div class="panel"><form id="vehicleForm" novalidate><div class="grid"><div class="field"><label>FIN (17 Zeichen) *</label><input name="vin" required minlength="17" maxlength="17" pattern="[A-HJ-NPR-Z0-9a-hj-npr-z]{17}" style="text-transform:uppercase" autocapitalize="characters" spellcheck="false" placeholder="WVWZZZ..." autocomplete="off" value="${esc(initialVin)}"></div><div class="field"><label>Bestandsnummer</label><input name="stock" placeholder="z. B. 2026-104"></div><div class="field"><label>Hersteller *</label><input name="make" required placeholder="z. B. Hyundai"></div><div class="field"><label>Modell *</label><input name="model" required placeholder="z. B. Tucson"></div><div class="field"><label>Farbe</label><input name="color"></div><div class="field"><label>Anlieferdatum</label><input name="delivered" type="date"></div><div class="field"><label>Lieferant</label><input name="supplier"></div><div class="field"><label>Spedition</label><input name="carrier"></div></div><div class="field cmr-box"><label>CMR / Frachtbrief (optional bei Fahrzeuganlage)</label><input name="cmr" type="file" accept="image/*,application/pdf"><div class="hint">Nur bei einem Transportschaden verpflichtend. Bild oder PDF, maximal 3 MB.</div></div><div class="field"><label>Notizen zur Annahme</label><textarea name="notes"></textarea></div><button type="submit">Fahrzeug speichern</button></form></div><p class="hint">FIN wird vor dem Speichern auf Format und vorhandene Datensätze geprüft. Foto-/OCR-Erkennung folgt in einer späteren Version.</p>`}
function detail(){let v=state.vehicles.find(v=>v.id===selected);if(!v)return '<p>Fahrzeug nicht gefunden.</p>';let ds=damagesFor(v.id);return `<button class="secondary back" id="back">← Fahrzeuge</button><div class="panel"><div class="item-head"><div><h1>${esc(v.make)} ${esc(v.model)}</h1><p class="muted">FIN: ${esc(v.vin)}</p></div><span class="pill">${ds.length} Schäden</span></div><div class="grid"><p><b>Bestandsnummer:</b> ${esc(v.stock||'–')}<br><b>Farbe:</b> ${esc(v.color||'–')}<br><b>Anlieferung:</b> ${date(v.delivered)}</p><p><b>Lieferant:</b> ${esc(v.supplier||'–')}<br><b>Spedition:</b> ${esc(v.carrier||'–')}</p></div><p><b>Annahmenotizen:</b> ${esc(v.notes||'–')}</p><div class="cmr-box"><b>CMR / Frachtbrief:</b> ${cmrLink(v.cmr)}</div><div class="actions"><button id="addDamage">+ Schaden erfassen</button><button class="secondary" id="exportVehicle">Akte exportieren</button></div></div><div class="panel"><h2>Schadenfälle</h2>${ds.length?`<div class="list">${ds.map(d=>`<div class="item"><div class="item-head"><div><h3>${esc(d.part)} · ${esc(d.kind)}</h3><span class="pill ${d.status==='Abgeschlossen'?'':'warn'}">${esc(d.status)}</span><p>${esc(d.description||'Keine Beschreibung')}</p><div class="hint">${esc(d.category)} · ${date(d.createdAt)} · ${d.photos.length} Fotos · Anspruch: ${esc(d.claimant||'offen')}</div>${d.category==='Transportschaden'?`<div class="cmr-box"><b>CMR-Vermerk:</b> ${esc(d.cmrNoted||'Nicht erfasst')} · <b>Fahrerunterschrift:</b> ${esc(d.cmrSigned||'Nicht erfasst')}${d.cmrNotes?`<p>${esc(d.cmrNotes)}</p>`:''}${d.cmrNoted==='Nein'?'<p class="hint" style="color:#a65a00">⚠️ Schaden nicht auf CMR vermerkt</p>':''}</div>`:''}</div><div class="actions"><button class="secondary editDamage" data-id="${d.id}">Bearbeiten</button><button class="sendDamage" data-id="${d.id}">✉ E-Mail</button></div></div>${d.photos.length?`<div class="photo-grid">${d.photos.map(p=>`<a href="${p.data}" target="_blank" rel="noopener"><img src="${p.data}" alt="Schadenfoto"></a>`).join('')}</div>`:''}</div>`).join('')}</div>`:'<div class="empty">Noch keine Schäden erfasst.</div>'}</div>`}
function damageForm(){let v=state.vehicles.find(v=>v.id===selected),d=state.damages.find(d=>d.id===editingDamage);if(!v)return '<p>Fahrzeug nicht gefunden.</p>';return `<button class="secondary back" id="backDetail">← Fahrzeugakte</button><h1>${d?'Schaden bearbeiten':'Schritt 2 von 2: Schaden fotografieren'}</h1><p class="muted">${esc(v.make)} ${esc(v.model)} · ${esc(v.vin)}</p><div class="panel"><form id="damageForm">${!v.cmr?`<div class="cmr-box" id="cmrRequiredBox"><label>CMR / Frachtbrief * (nur bei Transportschaden)</label><input id="cmrDamageInput" type="file" accept="image/*,application/pdf"><p class="hint">Bei sonstigen Fahrzeugschäden nicht erforderlich. Bild oder PDF, maximal 3 MB.</p></div>`:`<div class="cmr-box"><b>CMR vorhanden:</b> ${cmrLink(v.cmr)}</div>`}<div class="cmr-box hidden" id="cmrStatementBox"><h3>CMR-Schadenvermerk</h3><p class="hint">Bei einem Transportschaden bitte beide Angaben beantworten. Ein fehlender Vermerk verhindert die Dokumentation nicht.</p><div class="grid"><div class="field"><label for="cmrNoted">Schaden auf dem CMR vermerkt? *</label><select id="cmrNoted" name="cmrNoted"><option value="">Bitte auswählen</option><option value="Ja" ${d?.cmrNoted==='Ja'?'selected':''}>Ja</option><option value="Nein" ${d?.cmrNoted==='Nein'?'selected':''}>Nein</option></select></div><div class="field"><label for="cmrSigned">CMR vom Fahrer unterschrieben? *</label><select id="cmrSigned" name="cmrSigned"><option value="">Bitte auswählen</option><option value="Ja" ${d?.cmrSigned==='Ja'?'selected':''}>Ja</option><option value="Nein" ${d?.cmrSigned==='Nein'?'selected':''}>Nein</option></select></div></div><div class="notice hidden" id="cmrWarning" role="status">⚠️ Der Schaden ist laut Angabe nicht auf dem CMR vermerkt. Das kann die spätere Regulierung erschweren. Die Schadenakte kann trotzdem gespeichert werden.</div><div class="field"><label for="cmrNotes">Anmerkungen zum CMR / zur Übergabe</label><textarea id="cmrNotes" name="cmrNotes" placeholder="z. B. Fahrer verweigert Unterschrift, gesonderter Vermerk ...">${esc(d?.cmrNotes||'')}</textarea></div></div><div class="field"><label>Schadenfotos aufnehmen oder auswählen</label><input id="photoInput" type="file" accept="image/*" capture="environment" multiple><div class="hint">Zuerst die Schäden fotografieren. Danach die Details erfassen. Fotos werden für diese lokale Demo komprimiert.</div><div id="photoPreview" class="photo-grid"></div></div><div class="grid"><div class="field"><label>Schadenkategorie *</label><select name="category" id="damageCategory"><option ${d?.category==='Transportschaden'?'selected':''}>Transportschaden</option><option ${d?.category==='Sonstiger Fahrzeugschaden'?'selected':''}>Sonstiger Fahrzeugschaden</option></select></div><div class="field"><label>Bauteil / Schadenort *</label><input name="part" required value="${esc(d?.part||'')}" placeholder="z. B. Tür vorne links"></div><div class="field"><label>Schadenart *</label><select name="kind">${['Kratzer','Delle','Lackschaden','Bruch','Fehlteil','Verschmutzung','Sonstiges'].map(x=>`<option ${d?.kind===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Status</label><select name="status">${['Aufgenommen','Gemeldet','Kostenvoranschlag angefordert','Freigabe ausstehend','Freigegeben','In Reparatur','Reparatur abgeschlossen','Abrechnung offen','Rechnung versendet','Abgeschlossen'].map(x=>`<option ${d?.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Voraussichtlicher Anspruchsgegner / Rechnungsempfänger</label><select name="claimant">${['Noch offen','Lieferant','Spedition','Versicherung','Sonstige'].map(x=>`<option ${d?.claimant===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Feststellungsdatum</label><input type="date" name="found" value="${esc(d?.found||new Date().toISOString().slice(0,10))}"></div></div><div class="field"><label>Schadenbeschreibung</label><textarea name="description" placeholder="Was ist sichtbar beschädigt?">${esc(d?.description||'')}</textarea></div><div class="actions"><button type="submit">Schaden speichern</button><button type="button" class="secondary" id="cancelDamage">Abbrechen</button></div></form></div>`}
let pendingPhotos=[];async function processPhotos(files){for(const file of files){if(!file.type.startsWith('image/'))continue;let data=await resize(file);pendingPhotos.push({id:uid(),name:file.name,data})}showPhotos()}function resize(file){return new Promise((resolve,reject)=>{let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let scale=Math.min(1,1200/Math.max(img.width,img.height));let c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.72))};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Bild nicht lesbar'))};img.src=url})}function showPhotos(){let el=document.getElementById('photoPreview');if(el)el.innerHTML=pendingPhotos.map(p=>`<div class="photo"><img src="${p.data}" alt="Vorschau"><button type="button" class="removePhoto" data-id="${p.id}" aria-label="Foto entfernen">×</button></div>`).join('');document.querySelectorAll('.removePhoto').forEach(b=>b.onclick=()=>{pendingPhotos=pendingPhotos.filter(p=>p.id!==b.dataset.id);showPhotos()})}

function emailForm(){let d=state.damages.find(x=>x.id===emailDamageId),v=d&&state.vehicles.find(x=>x.id===d.vehicleId);if(!d||!v)return '<p>Schaden nicht gefunden.</p>';let ready=d.category!=='Transportschaden'||!!v.cmr;return `<button class="secondary" id="backEmail">← Zur Fahrzeugakte</button><div class="panel"><h1>Schadenmeldung vorbereiten</h1><div class="notice"><b>Testmodus – Versand gesperrt.</b> Microsoft-365-Freigabe und geschütztes Backend fehlen noch. Die App sendet keine E-Mails.</div><form id="emailForm"><div class="field"><label>Empfänger *</label><input type="email" name="recipient" required autocomplete="email" placeholder="schaden@lieferant.de"></div><div class="field"><label>Betreff *</label><input name="subject" required value="Schadenmeldung – ${esc(v.make)} ${esc(v.model)} – FIN ${esc(v.vin)}"></div><div class="field"><label>Nachricht / Ergänzungen</label><textarea name="message" placeholder="Sehr geehrte Damen und Herren, ..."></textarea></div><div class="cmr-box"><b>Vorgesehene Anlagen</b><p>✓ Schadenbericht als PDF<br>✓ ${(d.photos||[]).length} Schadenfoto(s)<br>${v.cmr?'✓ CMR: '+esc(v.cmr.name):'– Kein CMR vorhanden'}</p>${!ready?'<p style="color:#9a3425">CMR fehlt: Transportschaden ist noch nicht versandbereit.</p>':''}</div><div class="actions"><button type="button" class="secondary" id="saveReport">⬇ PDF-Schadenbericht erstellen</button><button type="button" class="secondary" id="exportMailPackage">⬇ Versandpaket (JSON) exportieren</button><button type="button" disabled title="Erst nach IT-Freigabe und Backend-Anbindung verfügbar">✉ Verbindlich senden (noch gesperrt)</button></div></form><p class="hint">PDF enthält die erfassten Textdaten und ein Anlagenverzeichnis. Fotos und CMR bleiben separate Dateien im vorbereiteten Versandpaket. Es findet kein Versand statt.</p></div>`}
function damageReport(d,v,message=''){return ['SCHADENMELDUNG – CarDamage Manager','',`Fahrzeug: ${v.make||''} ${v.model||''}`,`FIN: ${v.vin}`,`Bestandsnummer: ${v.stock||'–'}`,`Anlieferdatum: ${v.delivered||'–'}`,`Lieferant: ${v.supplier||'–'}`,`Spedition: ${v.carrier||'–'}`,'',`Schadenkategorie: ${d.category||'–'}`,`Schadenort/Bauteil: ${d.part||'–'}`,`Schadenart: ${d.kind||'–'}`,`Feststellung: ${d.found||'–'}`,`Beschreibung: ${d.description||'–'}`,`Status: ${d.status||'–'}`,`Voraussichtlicher Anspruchsgegner: ${d.claimant||'–'}`,`Schaden auf CMR vermerkt: ${d.cmrNoted||'–'}`,`CMR vom Fahrer unterschrieben: ${d.cmrSigned||'–'}`,`Anmerkungen: ${d.cmrNotes||'–'}`,`Schadenfotos: ${(d.photos||[]).length}`,`CMR vorhanden: ${v.cmr?'Ja':'Nein'}`,'',message,'','Hinweis: Angaben bitte vor Versand prüfen.'].join('\n')}
function dataFile(data,name){let a=data.split(','),mime=(a[0].match(/data:([^;]+)/)||[])[1]||'application/octet-stream';let bytes=atob(a[1]),u=new Uint8Array(bytes.length);for(let i=0;i<bytes.length;i++)u[i]=bytes.charCodeAt(i);return new File([u],name,{type:mime})}
// Kleiner offlinefähiger PDF-Generator (A4, Textbericht, mehrseitig). Keine externen Bibliotheken.
function pdfReportBlob(report){
  const cp1252={8364:128,8218:130,402:131,8222:132,8230:133,8224:134,8225:135,710:136,8240:137,352:138,8249:139,338:140,381:142,8216:145,8217:146,8220:147,8221:148,8226:149,8211:150,8212:151,732:152,8482:153,353:154,8250:155,339:156,382:158,376:159};
  const encode=t=>Array.from(t).map(c=>{let x=c.codePointAt(0);return x<256?x:(cp1252[x]??63)});
  const str=t=>encode(t).map(n=>n===40?'\\(':n===41?'\\)':n===92?'\\\\':String.fromCharCode(n)).join('');
  let lines=[];for(let raw of report.split('\n')){if(!raw){lines.push('');continue}let remaining=raw;while(remaining.length>89){let cut=remaining.lastIndexOf(' ',89);if(cut<25)cut=89;lines.push(remaining.slice(0,cut));remaining=remaining.slice(cut).trimStart()}lines.push(remaining)}
  let pages=[];for(let i=0;i<lines.length;i+=51)pages.push(lines.slice(i,i+51));if(!pages.length)pages=[[]];
  let objects=['','<< /Type /Catalog /Pages 2 0 R >>','', '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>'];let kids=[];
  for(let page of pages){let p=objects.length,c=p+1;kids.push(`${p} 0 R`);objects.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R >> >> /Contents ${c} 0 R >>`);let content='BT /F1 10 Tf 48 792 Td 13 TL\n'+page.map((line,i)=>`${i?'T* ':''}(${str(line)}) Tj`).join('\n')+'\nET';objects.push(`<< /Length ${encode(content).length} >>\nstream\n${content}\nendstream`)}
  objects[2]=`<< /Type /Pages /Count ${kids.length} /Kids [${kids.join(' ')}] >>`;
  let output=[...encode('%PDF-1.4\n%PDF\n')],offsets=[0];let append=t=>output.push(...encode(t));for(let i=1;i<objects.length;i++){offsets[i]=output.length;append(`${i} 0 obj\n${objects[i]}\nendobj\n`)}let xref=output.length;append(`xref\n0 ${objects.length}\n0000000000 65535 f \n`);for(let i=1;i<objects.length;i++)append(`${String(offsets[i]).padStart(10,'0')} 00000 n \n`);append(`trailer\n<< /Size ${objects.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);return new Blob([new Uint8Array(output)],{type:'application/pdf'})
}
function saveBlob(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}

('input',e=>{let q=e.target.value.toLowerCase();document.getElementById('vehicleList').innerHTML=state.vehicles.filter(v=>[v.vin,v.make,v.model,v.stock].join(' ').toLowerCase().includes(q)).map(vehicleItem).join('')||'<div class="empty">Keine Treffer.</div>';document.querySelectorAll('.open').forEach(b=>b.onclick=()=>setPage('detail',b.dataset.id))});document.querySelectorAll('input[name=vin]').forEach(input=>{input.addEventListener('input',()=>normalizeVinInput(input));input.addEventListener('paste',()=>setTimeout(()=>normalizeVinInput(input),0))});document.getElementById('vehicleForm')?.addEventListener('submit',async e=>{e.preventDefault();let f=e.target,vin=val(f,'vin').toUpperCase();if(!/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)){alert('Bitte eine gültig formatierte 17-stellige FIN eingeben.');return}if(state.vehicles.some(v=>v.vin===vin)){alert('Diese FIN ist bereits vorhanden.');return}let cmr=null;if(f.elements.cmr.files[0]){try{cmr=await readFileData(f.elements.cmr.files[0])}catch(err){alert('CMR konnte nicht gespeichert werden: '+err.message);return}}let v={id:uid(),vin,cmr,stock:val(f,'stock'),make:val(f,'make'),model:val(f,'model'),color:val(f,'color'),delivered:val(f,'delivered'),supplier:val(f,'supplier'),carrier:val(f,'carrier'),notes:val(f,'notes'),createdAt:new Date().toISOString()};state.vehicles.push(v);if(save()){initialVin='';if(captureAfterVehicle){captureAfterVehicle=false;beginDamageFor(v.id)}else setPage('detail',v.id)}});document.getElementById('photoInput')?.addEventListener('change',async e=>{try{await processPhotos([...e.target.files])}catch(err){alert('Foto konnte nicht geladen werden: '+err.message)}});if(page==='damage'){showPhotos();let cat=document.getElementById('damageCategory'),cmrBox=document.getElementById('cmrRequiredBox'),statement=document.getElementById('cmrStatementBox'),noted=document.getElementById('cmrNoted'),signed=document.getElementById('cmrSigned'),warning=document.getElementById('cmrWarning');if(cat){const update=()=>{let transport=cat.value==='Transportschaden';if(cmrBox)cmrBox.classList.toggle('hidden',!transport);if(statement)statement.classList.toggle('hidden',!transport);let inp=document.getElementById('cmrDamageInput');if(inp)inp.required=transport;if(noted)noted.required=transport;if(signed)signed.required=transport;if(warning)warning.classList.toggle('hidden',!transport||noted.value!=='Nein')};cat.addEventListener('change',update);noted?.addEventListener('change',update);update()}}document.getElementById('cancelDamage')?.addEventListener('click',()=>setPage('detail'));document.getElementById('damageForm')?.addEventListener('submit',async e=>{e.preventDefault();let f=e.target,vehicle=state.vehicles.find(v=>v.id===selected);if(val(f,'category')==='Transportschaden'&&(!val(f,'cmrNoted')||!val(f,'cmrSigned'))){alert('Bitte CMR-Schadenvermerk und Fahrerunterschrift mit Ja oder Nein beantworten.');return}if(val(f,'category')==='Transportschaden'&&!vehicle.cmr){try{vehicle.cmr=await readFileData(document.getElementById('cmrDamageInput')?.files[0])}catch(err){alert('Bei einem Transportschaden ist das CMR Pflicht: '+err.message);return}}let old=state.damages.find(d=>d.id===editingDamage);let d={id:old?.id||uid(),vehicleId:selected,category:val(f,'category'),part:val(f,'part'),kind:val(f,'kind'),status:val(f,'status'),claimant:val(f,'claimant'),found:val(f,'found'),description:val(f,'description'),cmrNoted:val(f,'category')==='Transportschaden'?val(f,'cmrNoted'):'',cmrSigned:val(f,'category')==='Transportschaden'?val(f,'cmrSigned'):'',cmrNotes:val(f,'category')==='Transportschaden'?val(f,'cmrNotes'):'',photos:pendingPhotos,createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};if(old)Object.assign(old,d);else state.damages.push(d);if(save()){editingDamage=null;pendingPhotos=[];setPage('detail')}});document.getElementById('exportVehicle')?.addEventListener('click',()=>{let v=state.vehicles.find(v=>v.id===selected);download({vehicle:v,damages:damagesFor(v.i
